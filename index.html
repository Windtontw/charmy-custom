<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Charmy chan 向量互動上色</title>
<style>
:root{--bg:#faf7f2;--ink:#33333a;--mut:#8a8a96;--bd:#e3ded3;}
*{box-sizing:border-box;} body{margin:0;font-family:'PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink);}
header{padding:14px 20px;border-bottom:1px solid var(--bd);background:#fff;} header h1{margin:0;font-size:18px;} header p{margin:4px 0 0;font-size:12.5px;color:var(--mut);}
.wrap{display:flex;gap:18px;padding:18px;align-items:flex-start;flex-wrap:wrap;}
.left{flex:1 1 380px;min-width:300px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;}
.stage svg{max-width:100%;height:auto;max-height:74vh;}
.stage svg{pointer-events:none;}.stage svg [data-region]{pointer-events:auto;cursor:pointer;}.sw:hover{transform:scale(1.08);transition:transform .1s;} .stage svg [data-region]:hover{opacity:.85;}
.mid{flex:0 0 240px;max-width:260px;} .right{flex:0 0 300px;max-width:320px;}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;} .card h2{margin:0 0 10px;font-size:14px;}
.tabs{display:flex;gap:8px;margin-bottom:6px;} .tab{flex:1;padding:9px;border:1px solid var(--bd);background:#fff;border-radius:9px;cursor:pointer;font-size:14px;font-weight:700;} .tab.on{background:#33333a;color:#fff;border-color:#33333a;}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.sw{position:relative;aspect-ratio:1;border:2px solid #d8d2c6;border-radius:9px;cursor:pointer;padding:0;} .sw span{position:absolute;inset:auto 0 2px;font-size:9px;color:#000;text-shadow:0 0 3px #fff,0 0 3px #fff;pointer-events:none;} .sw.on{outline:3px solid #ff4d8d;outline-offset:1px;}.sw.on::after{content:'✓';position:absolute;top:1px;right:3px;font-size:13px;font-weight:700;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none;}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;flex-wrap:wrap;} .cur{width:30px;height:30px;border-radius:7px;border:2px solid #d8d2c6;}
.btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;} .btn{flex:1;min-width:110px;padding:10px;border:1px solid var(--bd);background:#fff;border-radius:9px;cursor:pointer;font-size:13.5px;} .btn:hover{background:#f2efe8;} .btn.pri{background:#33333a;color:#fff;border-color:#33333a;}
.hint{font-size:12px;color:var(--mut);line-height:1.6;margin-top:8px;} #readout{font-size:12.5px;color:var(--mut);min-height:18px;margin-top:6px;} input[type=color]{width:38px;height:30px;border:none;background:none;cursor:pointer;}
.reglist{display:flex;flex-direction:column;gap:6px;max-height:64vh;overflow:auto;}
.regrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bd);background:#fff;border-radius:9px;cursor:pointer;font-size:13.5px;text-align:left;width:100%;} .regrow:hover{background:#f7f2ea;border-color:#caa;}
.regchip{width:22px;height:22px;border-radius:6px;border:1px solid #bbb;flex:0 0 auto;} .regname{flex:1;} .reghead{font-size:11px;color:var(--mut);margin:4px 2px 0;}

.note{font-size:11.5px;color:#a4326b;background:#fff5f8;border:1px solid #f3d4e0;border-radius:7px;padding:6px 9px;margin-top:8px;line-height:1.5;}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.preset{padding:9px;border:1px solid var(--bd);background:#fff;border-radius:9px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:7px;}
.preset:hover{background:#f7f2ea;} .preset i{width:14px;height:14px;border-radius:4px;border:1px solid #bbb;display:inline-block;flex:0 0 auto;}
.seclist{display:flex;flex-direction:column;}
.schemerow{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--bd);border-radius:9px;margin-top:7px;font-size:13px;}
.schemerow .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.schemerow .dots{display:flex;gap:2px;flex:0 0 auto;} .schemerow .dots i{width:11px;height:11px;border-radius:2px;border:1px solid #ccc;display:inline-block;}
.minibtn{padding:4px 8px;border:1px solid var(--bd);background:#fff;border-radius:7px;cursor:pointer;font-size:12px;flex:0 0 auto;} .minibtn:hover{background:#f2efe8;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;padding:24px;overflow:auto;} .overlay.on{display:block;}
.cmpwrap{background:#fff;border-radius:14px;padding:18px;max-width:1100px;margin:0 auto;}
.cmpgrid{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.cmpcell{flex:0 0 220px;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fff;}
.cmpcell svg{max-width:100%;height:auto;max-height:300px;} .cmpcell .t{font-size:13px;font-weight:700;margin-bottom:6px;}
.closebtn{float:right;border:none;background:#33333a;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;}
header{position:relative;}.langbar{position:absolute;top:12px;right:16px;display:flex;gap:6px;}.lang{padding:5px 11px;border:1px solid var(--bd);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}.lang.on{background:#33333a;color:#fff;border-color:#33333a;}.allrow{background:#fff3d6;border-color:#e8c878!important;font-weight:700;}.allrow:hover{background:#ffe9b3!important;}.allrow .regchip{background:linear-gradient(135deg,#ff8fb1,#ffd23f,#9fd4e8)!important;}.speclist{display:flex;flex-direction:column;gap:4px;}.specrow{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--bd);}.specchip{width:18px;height:18px;border-radius:5px;border:1px solid var(--bd);flex:0 0 auto;}.specname{flex:0 0 92px;font-weight:700;}.specpan{flex:0 0 108px;}.spechex{color:var(--mut);font-size:11px;}
/* 配色表僅供匯出，不顯示在畫面上 */
#speccard{display:none!important;}
/* ===== 手機版面：娃娃(窄)＋區塊選單並排、色票移到下方；觸控優化 2026-06 ===== */
@media (max-width:760px){
  header{position:static;padding:8px 12px;}
  header h1{font-size:15px;}
  header p{display:none;}
  .langbar{position:static;justify-content:flex-end;margin-top:4px;}
  .lang{padding:8px 14px;font-size:14px;}
  /* 上排兩欄：左娃娃、右區塊選單；色票等移到下方整排 */
  .wrap{display:grid;grid-template-columns:1fr;gap:8px;padding:8px;align-items:start;}
  .left{grid-column:1;min-width:0;margin:0;padding:6px;position:relative;background:#fff;border:1px solid var(--bd);border-radius:12px;}
  .mid{grid-column:1;min-width:0;max-width:none;}
  .right{grid-column:1 / -1;min-width:0;max-width:none;}
  /* 款式切換：娃娃右上角小膠囊 */
  .tabs{position:absolute;top:8px;right:8px;z-index:6;margin:0;width:auto;gap:5px;}
  .tab{flex:0 0 auto;padding:5px 10px;font-size:12px;border-radius:16px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .stage{overflow:hidden;touch-action:none;}
  .stage svg{max-height:52vh;}
  .zoomhint{font-size:11px;color:var(--mut);margin-top:4px;}
  #readout{position:fixed;left:8px;right:8px;bottom:8px;z-index:60;background:rgba(30,30,34,.94);color:#fff;font-size:13px;line-height:1.5;padding:10px 12px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.28);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none;max-height:none;}#readout.show{opacity:1;transform:translateY(0);}
  .mid .card{margin:0;padding:8px;}
  .mid .card h2{font-size:13px;margin-bottom:4px;}
  .mid .reghead,.mid p{font-size:10px;margin:2px 0;}
  .reglist{max-height:30vh;overflow:auto;gap:6px;}
  .regrow{padding:9px 8px;font-size:13px;min-height:44px;}
  .regchip{width:20px;height:20px;}
  /* 下方色票放大成 6 欄整排 */
  .right .card:first-child{margin-bottom:10px;}
  .sws{grid-template-columns:repeat(6,1fr);gap:8px;}
  .sw{border-radius:9px;}
  .sw span{font-size:10px;}
  /* 觸控目標放大、消除點擊延遲 */
  .sw,.tab,.btn,.regrow,.preset,.minibtn,.lang,.schemerow,.allrow,input[type=color],.cur{touch-action:manipulation;}
  .btn{padding:13px;min-width:120px;font-size:14.5px;}
  .btns{gap:10px;}
  .preset{padding:12px;font-size:14px;}
  .minibtn{padding:8px 12px;font-size:13px;}
  .cur{width:40px;height:40px;}
  input[type=color]{width:48px;height:40px;}
  .row{font-size:14px;gap:12px;}
  .overlay{padding:10px;}
  .cmpwrap{padding:12px;}
  .cmpcell{flex:0 0 150px;}
}

/* 娃娃下方工具列（復原／還原大小）*/
.stagebar{display:flex;gap:6px;justify-content:center;margin-top:6px;}
.btn.mini{padding:7px 12px;font-size:12.5px;}
@media (max-width:760px){
  .stagebar{position:sticky;bottom:0;background:linear-gradient(to top,rgba(250,247,242,.98),rgba(250,247,242,.75));padding:6px 0 4px;z-index:5;}
  .btn.mini{padding:10px 16px;font-size:14px;}
  .regchip{width:34px;height:34px;border-radius:8px;border-width:2px;}
  .regrow{padding:11px 10px;}
  .regname{font-size:14px;}
}
</style></head><body>

'#b6e61a':'PANTONE 375 C','#1f5e4a':'PANTONE 343 C','#9fd4e8':'PANTONE 2975 C',
'#c8362f':'PANTONE 7626 C','#3fb6c6':'PANTONE 631 C',
'#fbf0c9':'奶油（無相近色號）','#d9f5c4':'蓄光材料（無色號）',
'#fbd9a8':'PANTONE 7507 C','#6b4a30':'PANTONE 469 C','#f2a7bb':'PANTONE 1895 C',
'#e03c31':'PANTONE 179 C','#f1e6b5':'PANTONE 7499 C','#f0b500':'PANTONE 7406 C',
'#ffffff':'白','#1a1a1a':'黑'
};
function panOf(hex,fallback){
  var h=(hex||'').toLowerCase();
  if(SWPAN[h]) return SWPAN[h];
  var nh=nearestHex(hex);
  if(nh&&SWPAN[nh.toLowerCase()]){
    var a=hx(hex),b=hx(nh);
    var d=Math.sqrt((a[0]-b[0])*(a[0]-b[0])+(a[1]-b[1])*(a[1]-b[1])+(a[2]-b[2])*(a[2]-b[2]));
    if(d<=90) return '≈ '+SWPAN[nh.toLowerCase()];
    return '自訂色（無對應色號）';
  }
  return fallback||'';
}
function swName(hex,l){const s=SWNAMES[(hex||'').toLowerCase()];return s?s[l]:hex;}

function snapshot(){const m={};REG.forEach((g,k)=>{m[k]=g.cur;});return m;}
function pushHistory(){HIST.push(snapshot());if(HIST.length>60)HIST.shift();}
function undo(){if(!HIST.length){readout.textContent=t('m_undo_empty');return;}paint(HIST.pop());}
function setFill(k,g,c){g.cur=c;if(k==='腮紅'){const a=stage.querySelector('#art');if(a)a.querySelectorAll('#blushgrad stop').forEach(st=>st.setAttribute('stop-color',c));}else{g.paths.forEach(p=>p.setAttribute('fill',c));}if(g.chip)g.chip.style.background=c;}
function paint(m){for(const reg in m){const g=REG.get(reg);if(!g)continue;setFill(reg,g,m[reg]);}if(typeof renderSpec==='function')renderSpec();}
function applyGroup(k){const g=REG.get(k);if(!g)return;pushHistory();setFill(k,g,color);if(typeof renderSpec==='function')renderSpec();}
function applyMap(m){pushHistory();paint(m);}
function applyAll(){pushHistory();const c=color;REG.forEach((g,k)=>setFill(k,g,c));if(typeof renderSpec==='function')renderSpec();}
function curMap(){return snapshot();}

function hx(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function nearestHex(hex){let best='',bd=1e9;const a=hx(hex);[...document.querySelectorAll('.sw')].forEach(s=>{const b=hx(s.dataset.c);const d=(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;if(d<bd){bd=d;best=s.dataset.c;}});return best;}

function buildSVG(key){
  const o=SVGS[key];
  stage.innerHTML='<svg id="art" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="'+o.vb+'">'+o.body+'</svg>';
  const el=stage.querySelector('#art'); reglist.innerHTML=''; REG=new Map(); HIST=[];
  el.querySelectorAll('path,ellipse,circle').forEach(p=>{ if(!p.hasAttribute('data-region')){ p.style.pointerEvents='none'; } });
  const els=[...el.querySelectorAll('[data-region]')];
  els.forEach(p=>{
    const k=p.getAttribute('data-region');
    let def=p.getAttribute('fill')||'#ffffff';
    if(k==='腮紅'){const st=el.querySelector('#blushgrad stop');if(st)def=st.getAttribute('stop-color');}
    p.setAttribute('data-orig',def);
    if(!REG.has(k)) REG.set(k,{paths:[],pantone:p.getAttribute('data-pantone')||'',chip:null,cur:def,orig:def});
    REG.get(k).paths.push(p);
    p.addEventListener('click',()=>applyGroup(k));
    p.addEventListener('mouseenter',()=>{ readout.textContent=partName(k)+'　'+(p.getAttribute('data-pantone')||''); });
  });
  function gy(k){let m=1e9; REG.get(k).paths.forEach(p=>{try{const b=p.getBBox(); m=Math.min(m,b.y+b.height/2);}catch(e){}}); return m;}
  let keys=[...REG.keys()].sort((a,b)=>gy(a)-gy(b));
  const ri=keys.indexOf('連身衣主色');
  if(ri>=0){keys.splice(ri,1); const ci=keys.indexOf('蕾絲領'); keys.splice(ci>=0?ci+1:keys.length,0,'連身衣主色');}
  const arow=document.createElement('button'); arow.className='regrow allrow';
  const achip=document.createElement('span'); achip.className='regchip';
  const anm=document.createElement('span'); anm.className='regname'; anm.setAttribute('data-i18n','reg_all'); anm.textContent=t('reg_all');
  arow.appendChild(achip); arow.appendChild(anm); reglist.appendChild(arow);
  arow.addEventListener('click',()=>{applyAll();readout.textContent=t('reg_all');});
  arow.addEventListener('mouseenter',()=>{REG.forEach(g=>g.paths.forEach(p=>p.style.opacity='0.4'));});
  arow.addEventListener('mouseleave',()=>{REG.forEach(g=>g.paths.forEach(p=>p.style.opacity='1'));});
  keys.forEach(k=>{
    const g=REG.get(k);
    const row=document.createElement('button'); row.className='regrow';
    const chip=document.createElement('span'); chip.className='regchip'; chip.style.background=g.cur||'#fff'; g.chip=chip; chip.style.cursor='pointer'; chip.title='點此吸取該區顏色'; chip.addEventListener('click',function(e){e.stopPropagation(); var c=g.cur; if(c){addCustomSwatch(c); readout.textContent='已吸取「'+partName(k)+'」的顏色，點其他部位即可套用';}});
    const nm=document.createElement('span'); nm.className='regname'; nm.dataset.key=k; nm.textContent=partName(k);
    row.appendChild(chip); row.appendChild(nm); reglist.appendChild(row);
    row.addEventListener('click',()=>applyGroup(k));
    row.addEventListener('mouseenter',()=>{ g.paths.forEach(p=>p.style.opacity='0.35'); readout.textContent=partName(k)+'　'+g.pantone; });
    row.addEventListener('mouseleave',()=>{ g.paths.forEach(p=>p.style.opacity='1'); });
  });
  renderSpec();
}
function addCustomSwatch(hex){hex=(hex||'').toLowerCase();var sws=document.querySelector('.sws');if(!/^#[0-9a-f]{6}$/.test(hex)||!sws){setColor(hex);return;}var exist=[].slice.call(sws.querySelectorAll('.sw')).filter(function(b){return (b.dataset.c||'').toLowerCase()===hex;})[0];if(exist){setColor(hex);return;}var btn=document.createElement('button');btn.className='sw';btn.dataset.c=hex;btn.setAttribute('data-custom','1');btn.title='自訂 '+hex;btn.style.background=hex;var sp=document.createElement('span');sp.textContent='自訂';btn.appendChild(sp);btn.addEventListener('click',function(){setColor(hex);});sws.appendChild(btn);var customs=[].slice.call(sws.querySelectorAll('.sw[data-custom]'));while(customs.length>6){customs[0].remove();customs.shift();}setColor(hex);}

document.getElementById('pngspec').addEventListener('click',()=>{const o=SVGS[cur];const vb=o.vb.split(' ').map(Number);const W=vb[2],H=vb[3];const img=new Image();const svgTxt=currentSVGText().replace('<svg','<svg width="'+W+'" height="'+H+'"');const blob=new Blob([svgTxt],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);img.onload=()=>{const FF='"PingFang TC","Microsoft JhengHei",sans-serif';const rows=specRows();const pad=56,dollH=1500,dollW=Math.round(dollH*W/H);const rowH=84,headH=160,tableW=1180;const tableH=headH+rows.length*rowH;const cw=pad*3+dollW+tableW;const ch=pad*2+Math.max(dollH,tableH);const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(img,pad,pad,dollW,dollH);const tx=pad*2+dollW,ty=pad;x.fillStyle='#33333a';x.font='700 54px '+FF;x.fillText(t('spec_title'),tx,ty+52);x.font='500 26px '+FF;x.fillStyle='#8a8a96';x.fillText(t('note_screen')||'',tx,ty+96);let yy=ty+headH;rows.forEach(r=>{const name=LANG==='en'?r[1]:LANG==='ja'?r[2]:r[0];const pantone=r[3]||'—';const hex=r[4];x.fillStyle=hex;x.fillRect(tx,yy-36,50,50);x.strokeStyle='#e3ded3';x.lineWidth=2;x.strokeRect(tx,yy-36,50,50);x.fillStyle='#33333a';x.font='700 33px '+FF;x.fillText(name,tx+76,yy);x.fillStyle='#1f5e4a';x.font='700 33px '+FF;x.fillText(pantone,tx+440,yy);x.fillStyle='#8a8a96';x.font='500 28px '+FF;x.fillText(String(hex).toUpperCase()+' ≈ '+r[5],tx+800,yy);x.strokeStyle='#eeeeee';x.lineWidth=1;x.beginPath();x.moveTo(tx,yy+28);x.lineTo(tx+tableW,yy+28);x.stroke();yy+=rowH;});URL.revokeObjectURL(url);const fname='Charmy_'+(cur==='cap'?'毛球帽':'熊耳')+'_PNG＋配色表.png';const isMobile=/Android|iP(hone|ad|od)/i.test(navigator.userAgent)||((matchMedia&&matchMedia('(pointer:coarse)').matches)&&(navigator.maxTouchPoints||0)>0);const linkSave=(u,name)=>{const a=document.createElement('a');if('download' in a){a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();}else{window.open(u,'_blank');}};const save=(b)=>{if(!b){if(readout)readout.textContent='PNG 產生失敗，請重試';return;}const u=URL.createObjectURL(b);const done=()=>setTimeout(()=>URL.revokeObjectURL(u),10000);if(isMobile&&navigator.canShare){const file=new File([b],fname,{type:'image/png'});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:fname}).catch(function(err){if(err&&(err.name==='AbortError'||/abort|cancel/i.test(err.message||'')))return;linkSave(u,fname);}).finally(done);return;}}linkSave(u,fname);done();};if(c.toBlob){c.toBlob(save,'image/png');}else{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=fname;a.click();}};img.onerror=()=>{if(readout)readout.textContent='PNG 產生失敗，請重試';URL.revokeObjectURL(url);};img.src=url;});

/* spec export (trilingual) */
function specRows(){const rows=[];REG.forEach((g,k)=>{const hex=g.cur;const nh=nearestHex(hex);const pz=PART[k]?PART[k].zh:k,pe=PART[k]?PART[k].en:k,pj=PART[k]?PART[k].ja:k;rows.push([pz,pe,pj,panOf(hex,g.pantone),hex,swName(nh,LANG)]);});return rows;}
function specCSV(){const head=t('spec_head');const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';return '﻿'+[head,...specRows()].map(r=>r.map(esc).join(',')).join('\r\n');}
function specText(){return t('spec_title')+'\n'+specRows().map(r=>r[0]+' / '+r[1]+' / '+r[2]+'：'+(r[3]||'—')+'｜'+r[4]+'（≈'+r[5]+'）').join('\n');}


function renderSpec(){var box=document.getElementById('specbox');if(!box)return;var h='';REG.forEach(function(g,k){var hex=g.cur;var nh=nearestHex(hex);h+='<div class="specrow"><span class="specchip" style="background:'+hex+'"></span><span class="specname">'+partName(k)+'</span><span class="specpan">'+(panOf(hex,g.pantone)||'—')+'</span><span class="spechex">'+String(hex).toUpperCase()+' ≈ '+swName(nh,LANG)+'</span></div>';});box.innerHTML=h;}

/* schemes */
const SKEY='charmy_schemes_v1';
let SCHEMES=[];
try{SCHEMES=JSON.parse(localStorage.getItem(SKEY)||'[]');if(!Array.isArray(SCHEMES))SCHEMES=[];}catch(e){SCHEMES=[];}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(SCHEMES));return true;}catch(e){if(typeof readout!=='undefined'&&readout)readout.textContent=t('m_savefail');return false;}}
function esc(x){return String(x).replace(/[&<>"']/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];});}
function renderSchemes(){const box=document.getElementById('schemelist');box.innerHTML='';SCHEMES.forEach((s,idx)=>{if(s.tab!==cur)return;const row=document.createElement('div');row.className='schemerow';const dots=Object.values(s.map).slice(0,8).map(c=>'<i style="background:'+c+'"></i>').join('');row.innerHTML='<span class="nm">'+esc(s.name)+'</span><span class="dots">'+dots+'</span><button class="minibtn" data-load="'+idx+'">'+(LANG==='zh'?'載入':LANG==='ja'?'読込':'Load')+'</button><button class="minibtn" data-del="'+idx+'">'+(LANG==='zh'?'刪':LANG==='ja'?'削除':'Del')+'</button>';box.appendChild(row);});}
document.getElementById('schemelist').addEventListener('click',e=>{const l=e.target.getAttribute('data-load'),d=e.target.getAttribute('data-del');if(l!==null){applyMap(SCHEMES[+l].map);readout.textContent=t('m_loaded')+' 「'+SCHEMES[+l].name+'」';}else if(d!==null){if(confirm(t('c_del'))){SCHEMES.splice(+d,1);persist();renderSchemes();}}});
document.getElementById('savescheme').addEventListener('click',()=>{const name=prompt(t('p_name'));if(!name)return;SCHEMES.push({name:name,tab:cur,map:curMap()});persist();renderSchemes();readout.textContent=t('m_saved')+' 「'+name+'」';});

function _schemeCode(){var o={v:1,tab:cur,map:snapshot()};return 'CHARMY1-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function _applyCode(code){code=(code||'').trim();var i=code.indexOf('CHARMY1-');if(i>=0)code=code.slice(i+8);code=code.replace(/\s+/g,'');var j;try{j=JSON.parse(decodeURIComponent(escape(atob(code))));}catch(e){return {ok:false,msg:'配色碼無法解析'};}if(!j||typeof j!=='object'||!j.map||typeof j.map!=='object'){return {ok:false,msg:t('m_badcode')};}if(j.v!==undefined&&j.v!==1){return {ok:false,msg:t('m_badcode')};}if(j.tab!==undefined&&j.tab!=='cap'&&j.tab!=='ears'){return {ok:false,msg:t('m_badcode')};}var _valid={},_okn=0;for(var _k in j.map){if(!PART[_k])continue;if(!/^#[0-9a-fA-F]{6}$/.test(String(j.map[_k])))continue;_valid[_k]=String(j.map[_k]).toLowerCase();_okn++;}if(!_okn){return {ok:false,msg:t('m_badcode')};}j.map=_valid;if(j.tab&&j.tab!==cur){var tb=document.querySelector('.tab[data-k="'+j.tab+'"]');if(tb){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});tb.classList.add('on');cur=j.tab;buildSVG(cur);renderSchemes();}}pushHistory();paint(j.map);if(typeof renderSpec==='function')renderSpec();return {ok:true};}
var _btnExp=document.getElementById('exportcode');if(_btnExp)_btnExp.addEventListener('click',function(){var code=_schemeCode();var out=document.getElementById('codeout');if(out)out.value=code;try{navigator.clipboard.writeText(code);readout.textContent='已產生配色碼並複製到剪貼簿';}catch(e){if(out){out.focus();out.select();}readout.textContent='已產生配色碼（請手動複製）';}});
var _btnCopy=document.getElementById('copycode');if(_btnCopy)_btnCopy.addEventListener('click',function(){var out=document.getElementById('codeout');if(!out||!out.value){readout.textContent='尚無配色碼，請先按「匯出配色碼」';return;}out.focus();out.select();var _done=function(ok){readout.textContent=t(ok?'m_copyok':'m_copyman');};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out.value).then(function(){_done(true);}).catch(function(){var ok=false;try{ok=document.execCommand('copy');}catch(e){}_done(ok);});}else{var ok=false;try{ok=document.execCommand('copy');}catch(e){}_done(ok);}});

<script>
/* ===== 娃娃雙指縮放／拖移（僅觸控裝置啟用，不影響桌機與上色邏輯） 2026-06 ===== */
(function(){
  var stage=document.getElementById('stage');
  if(!stage) return;
  var isTouch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
  if(!isTouch) return;
  var scale=1,tx=0,ty=0,pts=new Map(),startDist=0,startScale=1,startTx=0,startTy=0,panStart=null,moved=false,lastTap=0;window.__charmyResetZoom=function(){scale=1;tx=0;ty=0;apply();};stage.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;if(typeof readout!=='undefined'&&readout)readout.textContent=t('m_zoomed');}},true);
  function art(){return stage.querySelector('#art');}
  function apply(){var a=art();if(!a)return;a.style.transformOrigin='center center';a.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';}
  function reset(){scale=1;tx=0;ty=0;apply();}
  new MutationObserver(function(){scale=1;tx=0;ty=0;apply();}).observe(stage,{childList:true});
  stage.addEventListener('pointerdown',function(e){
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){var p=[...pts.values()];startDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);startScale=scale;startTx=tx;startTy=ty;moved=true;e.preventDefault();}
    else if(pts.size===1){panStart={x:e.clientX,y:e.clientY,tx:tx,ty:ty};moved=false;}
  },{passive:false});
  stage.addEventListener('pointermove',function(e){
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2){var p=[...pts.values()];var d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(startDist>0){scale=Math.min(5,Math.max(1,startScale*(d/startDist)));}apply();e.preventDefault();}
    else if(pts.size===1&&panStart&&scale>1){var dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;var st=stage.getBoundingClientRect();var lim=Math.max(0,(scale-1)*st.width/2),limY=Math.max(0,(scale-1)*st.height/2);tx=Math.max(-lim,Math.min(lim,panStart.tx+dx));ty=Math.max(-limY,Math.min(limY,panStart.ty+dy));apply();e.preventDefault();}
  },{passive:false});
  function up(e){
    pts.delete(e.pointerId);
    if(pts.size<2)startDist=0;
    if(pts.size===0){if(scale<=1.02){scale=1;tx=0;ty=0;apply();}panStart=null;

  }

  stage.addEventListener('pointercancel',up);

  hint.textContent='雙指縮放娃娃，放大後可拖移、雙擊還原';
  if(stage.parentNode) stage.parentNode.insertBefore(hint,stage.nextSibling);
})();
